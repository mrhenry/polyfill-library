user_agent_parsers:
  # iOS apps and browsers render with WebKit (Safari's engine), so map every iOS
  # UA to "Mobile Safari/WKWebView" and expose the iOS OS version (not the Safari
  # version), which is what MDN BCD and the polyfill configs key on.
  # https://github.com/mdn/browser-compat-data/issues/17241
  - regex: '(iPod touch|iPod|iPhone|iPad).+OS[ +](\d+)[_.](\d+)(?:[_.](\d+)|)'
    family_replacement: "Mobile Safari/WKWebView"
