name: Test Polyfills (fork)

# Privileged BrowserStack tests for pull requests from forks.
#
# Triggered by the unprivileged "Build" workflow. The test harness is checked
# out from the default branch, so only trusted code runs on the runner with
# access to secrets. The build output from the fork is treated as data and is
# only ever executed inside the remote BrowserStack browsers.
#
# The "approve" job uses the "browserstack" environment with required reviewers.
# Secrets are only used after a maintainer approves the run, and every new commit
# triggers a new run that must be approved again.
on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: browserstack
  cancel-in-progress: false

jobs:
  approve:
    name: Approve BrowserStack tests for ${{ github.event.workflow_run.head_sha }}
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.fork == true
    runs-on: ubuntu-latest
    environment: browserstack
    steps:
      - run: echo "BrowserStack tests approved for ${{ github.event.workflow_run.head_sha }}"

  test:
    needs: approve
    if: >
      !cancelled() &&
      (needs.approve.result == 'success' || needs.approve.result == 'skipped') &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.fork == true
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        browser:
        - ie
        - android
        - chrome/1 - 50
        - chrome/51 - 100
        - chrome/>= 101
        - edge
        - firefox/1 - 50
        - firefox/51 - 100
        - firefox/>= 101
        - ios
        - safari
    steps:
      # Checkout the trusted harness from the default branch, never the fork.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'npm'

      # Download the untrusted build output into a separate directory so that it can't overwrite the workflow, the test harness or node_modules.
      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: polyfill-dist
          path: artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Apply build output
        run: |
          rm -rf polyfills
          cp -R artifact/polyfills polyfills
          cp artifact/modified-files.txt modified-files.txt

      - name: Validate build output
        run: |
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const root = path.resolve("polyfills");
            const meta = JSON.parse(fs.readFileSync("polyfills/__dist/meta.json", "utf-8"));
            for (const [name, data] of Object.entries(meta)) {
              const resolved = path.resolve(root, data.baseDir || "");
              if (resolved !== root && !resolved.startsWith(root + path.sep)) {
                throw new Error(`Invalid baseDir for ${name}: ${data.baseDir}`);
              }
            }
          '

      - run: npm ci

      - name: Test ${{ matrix.browser }}
        run: node ./test/polyfills/server.js & node ./test/polyfills/remotetest.js
          test-modified-only targeted director browser="${{ matrix.browser }}"
        timeout-minutes: 30
        env:
          MODIFIED_FILES_FILE: modified-files.txt
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
