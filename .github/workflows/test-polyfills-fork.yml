name: Test Polyfills (fork)
on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  # Branch-based pull request
  test:
    name: test
    # "Build" only ever runs for pull requests from forks, so following it is
    # enough. A failed or cancelled build is not worth testing.
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # Job level so that the BrowserStack slot is only held while tests run.
    concurrency:
      group: browserstack
      cancel-in-progress: false
      queue: max
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        browser:
        - ie
        - android
        - chrome/1 - 50
        - chrome/51 - 100
        - chrome/>= 101
        - edge
        - firefox/1 - 50
        - firefox/51 - 100
        - firefox/>= 101
        - ios
        - safari
    steps:

    - name: Branch based PR checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.repository.default_branch }}

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        cache: 'npm'

    # Installed before the untrusted artifact is on disk at all.
    - run: npm ci

    # Downloaded into a separate directory so the artifact cannot overwrite this
    # workflow, the test harness or node_modules. The run id comes from the event,
    # so there is nothing to wait for.
    - name: Download build output
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: polyfill-dist
        path: artifact
        run-id: ${{ github.event.workflow_run.id }}
        github-token: ${{ github.token }}

    # Copy across only the paths the test harness reads.
    - name: Apply build output
      run: |
        rm -rf polyfills
        cp -R artifact/polyfills polyfills
        cp artifact/modified-files.txt modified-files.txt

    # "polyfills/__dist/meta.json" comes from the fork and decides where the test
    # harness reads the test suites from, so make sure it cannot point outside of
    # the polyfills directory.
    - name: Validate build output
      run: |
        node -e '
          const fs = require("node:fs");
          const path = require("node:path");
          const root = path.resolve("polyfills");
          const meta = JSON.parse(fs.readFileSync("polyfills/__dist/meta.json", "utf-8"));
          for (const [name, data] of Object.entries(meta)) {
            const resolved = path.resolve(root, data.baseDir || "");
            if (resolved !== root && !resolved.startsWith(root + path.sep)) {
              throw new Error(`Invalid baseDir for ${name}: ${data.baseDir}`);
            }
          }
        '

    - name: Test ${{ matrix.browser }}
      run: node ./test/polyfills/server.js & node ./test/polyfills/remotetest.js
        test-modified-only targeted director browser="${{ matrix.browser }}"
      timeout-minutes: 30
      env:
        MODIFIED_FILES_FILE: modified-files.txt
        BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
        BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
