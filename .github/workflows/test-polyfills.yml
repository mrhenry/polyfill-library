name: Test Polyfills
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: browserstack
  cancel-in-progress: false
  queue: max

jobs:
  # Branch-based pull request
  test:
    if: github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        browser:
        - ie
        - android
        - chrome/1 - 50
        - chrome/51 - 100
        - chrome/>= 101
        - edge
        - firefox/1 - 50
        - firefox/51 - 100
        - firefox/>= 101
        - ios
        - safari
    steps:

    - name: Branch based PR checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 50

    # Fetch main branch to determine which polyfills have changed and need testing.
    - name: Fetch upstream to determine diff
      run: |
        git remote add upstream https://github.com/mrhenry/polyfill-library.git
        git fetch --depth=50 upstream main

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        cache: 'npm'

    - name: env
      run: echo "commit-sha=$(echo ${GITHUB_SHA})" >> $GITHUB_ENV

    - run: npm ci

    - name: cache __dist
      id: cache-dist
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: polyfills/__dist
        key: cache--dist--${{ env.commit-sha }}

    - run: npm run build
      if: steps.cache-dist.outputs.cache-hit != 'true'

    - name: Test ${{ matrix.browser }}
      run: node ./test/polyfills/server.js & node ./test/polyfills/remotetest.js
        test-modified-only targeted director browser="${{ matrix.browser }}"
      timeout-minutes: 30
      env:
        BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
        BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}

  report:
    name: report
    needs: test
    if: always() && needs.test.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Publish the gate as a commit status
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SHA: ${{ github.sha }}
          TEST_RESULT: ${{ needs.test.result }}
        with:
          github-token: ${{ github.token }}
          script: |
            // Required status checks pass on success, skipped *and* neutral, so
            // anything that is not an explicit success has to be a failure.
            const state = process.env.TEST_RESULT === 'success' ? 'success' : 'failure';
            const summary = `Test Polyfills: ${process.env.TEST_RESULT}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.SHA,
              state,
              target_url: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}',
              context: 'Browserstack',
              description: summary.slice(0, 140),
            });
