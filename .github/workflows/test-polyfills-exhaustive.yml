name: Test Polyfills Exhaustive
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: browserstack
  cancel-in-progress: false
  queue: max

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        browser:
        - ie
        - android
        - chrome/1 - 50
        - chrome/51 - 100
        - chrome/>= 101
        - edge
        - firefox/1 - 50
        - firefox/51 - 100
        - firefox/>= 101
        - ios
        - safari

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1


      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'npm'

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'

      - name: env
        run: echo "commit-sha=$(echo ${GITHUB_SHA})" >> $GITHUB_ENV

      - run: npm ci

      - name: cache __dist
        id: cache-dist
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: polyfills/__dist
          key: cache--dist--${{ env.commit-sha }}

      - run: npm run build
        if: steps.cache-dist.outputs.cache-hit != 'true'

      - name: Test ${{ matrix.browser }}
        run: node ./test/polyfills/server.js & go run ./scripts/polyfills-browserstack
          test-polyfill-combinations targeted director browser="${{ matrix.browser }}"
        timeout-minutes: 45
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
